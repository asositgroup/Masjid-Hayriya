<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Oxirgi qadam qoldi — Telegram kanalga obuna boʻling</title>
    <meta
      name="description"
      content="Masjid qurilishi haqida maʼlumot olish uchun Telegram kanalga obuna boʻling."
    />
    <style>
*{margin:0;padding:0;box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{min-height:100vh;background:#f2f2f2;color:#000;font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}.thanks{display:flex;flex-direction:column;align-items:center;max-width:390px;margin-inline:auto;padding:12vh 20px 40px;text-align:center}.thanks_title{margin-bottom:8px;font-weight:700;font-size:clamp(28px,8.5vw,34px);line-height:1.1;text-transform:uppercase}.thanks_text{margin-bottom:24px;font-weight:500;font-size:clamp(15px,4.4vw,17px);line-height:1.5}.thanks_text b{font-weight:700}.thanks_arrow{display:block;width:16px;height:69px;margin-bottom:24px}.thanks_btn{display:flex;align-items:center;justify-content:center;width:100%;max-width:345px;min-height:72px;padding:20px 12px;border-radius:30px;background:#039be5;box-shadow:0 5px 0 0 #006393;color:#fff;font-weight:700;font-size:clamp(22px,6.5vw,26px);line-height:1;text-transform:uppercase;text-decoration:none}.thanks_btn:focus-visible{outline:3px solid #006393;outline-offset:3px}.thanks_error{margin-top:16px;font-size:14px;line-height:1.4;color:#c02626}.thanks_status{margin-bottom:16px;font-size:14px;line-height:1.4}.thanks_btn[aria-disabled="true"]{opacity:.6;cursor:wait;box-shadow:none}.thanks_retry{margin-top:16px;padding:12px 20px;border:0;border-radius:10px;background:#039be5;color:#fff;font:600 16px system-ui,sans-serif;cursor:pointer}.thanks_retry:focus-visible{outline:3px solid #006393;outline-offset:3px}.thanks_retry:disabled{opacity:.6;cursor:wait}
    </style>

  </head>
  <body>
    <main class="thanks">
      <h1 class="thanks_title">Oxirgi qadam qoldi!</h1>
      <p class="thanks_text">
        Quyidagi tugma orqali Telegram kanalga <b>obuna boʻling</b>
      </p>
      <svg class="thanks_arrow" viewBox="0 0 16 119" aria-hidden="true">
        <path
          d="M7.2929 118.707C7.68342 119.098 8.31659 119.098 8.70711 118.707L15.0711 112.343C15.4616 111.953 15.4616 111.319 15.0711 110.929C14.6805 110.538 14.0474 110.538 13.6569 110.929L8.00001 116.586L2.34315 110.929C1.95263 110.538 1.31946 110.538 0.928937 110.929C0.538413 111.319 0.538413 111.953 0.928937 112.343L7.2929 118.707ZM8 0L7 4.37114e-08L7.00001 118L8.00001 118L9.00001 118L9 -4.37114e-08L8 0Z"
          fill="#000"
        />
      </svg>
      <p class="thanks_status" id="submissionStatus" role="status" aria-live="polite">Maʼlumot tekshirilmoqda…</p>
      <a class="thanks_btn thankYouBtn" data-telegram-url="https://t.me/+DCcwSCfohihkNDA0" aria-disabled="true" tabindex="-1">Obuna boʻlish</a>
      <p class="thanks_error" id="errorMessage" role="alert" hidden></p>
      <button class="thanks_retry" id="retryBtn" type="button" hidden>Qayta yuborish</button>
      <noscript><p class="thanks_error">Maʼlumot yuborish uchun brauzerda JavaScriptʼni yoqing.</p></noscript>
    </main>
    <script defer src="./js/thankYou.js"></script>
  </body>
</html>
